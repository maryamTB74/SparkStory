[project]
name = "sparkstory"
version = "0.1.0"
description = "Agentic MCP server that generates personalised, illustrated children's storybooks"
readme = "README.md"
# PEP 639: SPDX expression plus the file to ship in built distributions. Declared
# here as well as in LICENSE so packaging metadata states it, not just the repo.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maryam Tabatabaei", email = "maryamtabatabaiii@gmail.com" }
]
requires-python = ">=3.14.0"
dependencies = [
    "fastmcp>=2.12,<3",
    "langchain>=1.3.14",
    "langchain-core>=1.5.2",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.0.3",
    # Static embeddings: a distilled model that runs as numpy at inference time, so
    # retrieval needs no API key, no network at query time and no GPU. Chosen over
    # Gemini embeddings because every Google call in this project's history has
    # failed, and over fastembed/sentence-transformers because it is the lightest
    # of the three that resolve on 3.14. See the spec's deviations table.
    "model2vec>=0.8.2",
    # Transitive through model2vec, declared because retrieval/store.py imports it
    # directly. An undeclared import that happens to be installed is a dependency
    # bump away from breaking.
    "numpy>=2.5.1",
    "pydantic-settings>=2.14.2",
    # PDF assembly. Core rather than infrastructure by this project's own test:
    # delete it and the app stops producing its output artifact, the same
    # argument that keeps FastMCP and LangGraph core. Chosen over weasyprint,
    # which needs Pango/cairo/GDK-Pixbuf as *system* libraries and would break
    # both `uv sync` on a clean clone and Phase B's Docker image.
    "reportlab>=4.2",
    # Web search. Off unless MAX_WEB_SEARCHES is raised, so
    # neither this nor firecrawl is imported on the default path.
    "langchain-perplexity>=0.1.1",
    # Fetches a cited page so the claim can be checked against it. The search
    # provider returns a URL the *model* wrote; fetching is what turns that into
    # provenance rather than an assertion.
    "firecrawl>=4.3.6",
    # Fallback search, used only when Perplexity is unusable. Its URLs come from
    # the API response rather than from a model, which is why it can also stand
    # in for verification when Firecrawl itself is the thing that is down.
    "tavily-python>=0.7.12",
    "opik>=2.2.18",
    # SQLAlchemy is used for the engine, `DeclarativeBase` and Alembic's
    # autogenerate -- NOT to build queries. The retrieval statement is a
    # hand-written CTE fusing pgvector's `<=>` with `ts_rank` via RRF, which no
    # ORM would generate and which is the point of the feature.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # psycopg v3, *sync*, and both halves of that are decisions.
    #
    # Sync rather than the course's asyncpg because `search_facts` and
    # `search_craft` are sync `@tool` functions called from inside LangGraph's
    # event loop: an async store would need `asyncio.run` there, which raises
    # inside a running loop, so async would force the tool signatures to change
    # too.
    #
    # `[binary]` bundles libpq in the wheel, which is what keeps the Dockerfile
    # free of an apt-get layer -- a property verified in the container by
    # rendering a PDF with no system libraries installed. Bare `psycopg` or
    # asyncpg would both reintroduce `libpq5`.
    "psycopg[binary]>=3.2",
]

[project.scripts]
# Points at the server entry point, not the package root. This is the command
# the README's Cursor/MCP client configuration invokes: `uv run sparkstory`.
sparkstory = "sparkstory.mcp.server:main"
# The other end of the same pipe: an interactive client for talking to the
# server. `--transport stdio` makes it spawn `sparkstory` above as a subprocess.
sparkstory-client = "sparkstory.mcp.client.repl:main"

[build-system]
# Upper bound widened from the <0.10.0 that `uv init` generated: the build
# backend version tracks the uv version, and the standalone uv here is 0.12.0,
# which fell outside that range and warned on every build.
requires = ["uv_build>=0.9.28,<0.13.0"]
build-backend = "uv_build"

# Resolve dependencies from public PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode = "auto" so async tests need no per-test marker. Most of this
# codebase is async; opting in individually is pure noise.
asyncio_mode = "auto"
# The default suite requires no network and no model weights, which has been true
# since Session 1 and is worth keeping true. Retrieval quality tests need real
# embeddings, so they are marked `corpus` and excluded here; `make test-corpus`
# runs them. A `-m` on the command line overrides this one.
addopts = ["-m", "not corpus and not vision and not video"]
markers = [
    "corpus: needs the built knowledge index and real embedding weights",
    "vision: needs a real vision model and the committed run images",
    "video: needs ffmpeg and ffprobe on PATH",
    "web: exercises the web-search half; the searching tests need TAVILY_API_KEY",
    # Split out of `corpus`, which means "needs the index and real embedding
    # weights" -- free and offline once the index exists. The reranker
    # comparison is neither: it puts an LLM in front of every labelled query and
    # bills for it. Sharing one marker meant a broad `pytest -m corpus` spent
    # money unasked, which has happened, and it put a paid call inside a CI job
    # built to hold no credentials.
    "rerank: compares reranking against fusion; COSTS MODEL CALLS, needs a key",
]
filterwarnings = [
    # fastmcp's JWT provider imports the deprecated authlib.jose module.
    # Third-party, nothing we can fix, and it appears in every test run.
    "ignore:.*authlib.jose module is deprecated.*",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort -- import ordering
    "UP",  # pyupgrade -- flag outdated syntax for our Python floor
    "B",   # bugbear -- likely bugs, e.g. mutable default arguments
    "SIM", # simplify
]
